<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغطية حصرية: ليفربول ضد مانشستر سيتي | لحظة بلحظة</title>
    <!-- استيراد خط أنيق من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .badge {
            background-color: #ef4444;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .match-card {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .team {
            font-weight: 700;
            font-size: 18px;
        }
        .vs {
            color: #38bdf8;
            font-size: 20px;
            font-weight: 900;
        }
        .btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">🔥 تغطية حصرية ملتهبة</div>
        <h1>ليفربول × مانشستر سيتي</h1>
        <p>تابع الآن أبرز اللقطات المثيرة، التشكيلة الرسمية، وكواليس ما قبل اللقاء مباشرة من منصات التواصل الاجتماعي والتحديثات الفورية.</p>
        
        <div class="match-card">
            <div class="team">🔴 ليفربول</div>
            <div class="vs">VS</div>
            <div class="team">🔵 مانشستر سيتي</div>
        </div>

        <!-- رابط إديستيرا الخاص بك -->
        <a href="https://www.profitableratecpmnetwork.com/k6m3s1kj?key=384085d471ecea82da753956b7c3440b" class="btn" target="_blank">
            اضغط هنا لمتابعة التغطية الحصرية والملخص ⚽
        </a>

        <div class="footer-note">محتوى حصري متجدد لحظة بلحظة. جميع الحقوق محفوظة.</div>
    </div>

</body>
</html>
